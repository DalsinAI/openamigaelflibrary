name: OpenELF (elf.library)

# elf.library's loader core under qemu-m68k (GCC objects, -q executables,
# PIEs, shared objects and a Rust object, loaded and run; refusals; damaged
# files), then the library itself in an emulated AmigaOS (amitools' vamos)
# running the ELF examples. The m68k ELF GCC builds everything: no NDK and
# no stove. MIT, Copyright (c) 2026 AmigaChrome Team.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  openelf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: m68k cross GCC and qemu-m68k
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu qemu-user
      - name: Rust's sources, for core and alloc on m68k
        run: rustup component add rust-src
      - name: amitools (vamos)
        run: pip install --break-system-packages amitools==0.8.1 machine68k==0.3.0
      - name: Loader core under qemu-m68k
        run: QEMU_M68K=qemu-m68k sh tests/test_openelf.sh
      - name: elf.library in vamos
        run: sh tests/test_openelf_vamos.sh
      - name: Build the Amiga drawer
        run: OUT=$PWD/openelf-drawer sh build-amiga.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openelf-drawer
          path: openelf-drawer
